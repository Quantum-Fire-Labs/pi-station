name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Verify tag and package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          test "$version" = "$package_version" || {
            printf 'Tag version %s does not match package version %s\n' "$version" "$package_version" >&2
            exit 1
          }
      - run: npm ci --ignore-scripts --include=dev
      - run: npm run check
      - name: Build release archive
        shell: bash
        run: npm run release:build -- "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-station-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-station-*
          path: release
          merge-multiple: true
      - name: Verify complete artifact set
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            test -f "release/pi-station-${version}-${platform}.tar.gz"
            test -f "release/pi-station-${version}-${platform}.tar.gz.sha256"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Pi Station ${GITHUB_REF_NAME#v}"
