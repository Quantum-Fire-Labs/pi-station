name: Edge release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: edge-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build edge (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - run: npm run check
      - name: Build edge archive
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')+${GITHUB_SHA::7}"
          npm run release:build -- "$version"
          source="release/pi-station-${version}-${{ matrix.platform }}.tar.gz"
          target="release/pi-station-edge-${{ matrix.platform }}.tar.gz"
          mv "$source" "$target"
          rm "$source.sha256"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            checksum="$(shasum -a 256 "$target" | awk '{print $1}')"
          else
            checksum="$(sha256sum "$target" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$checksum" "$(basename "$target")" > "$target.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-station-edge-${{ matrix.platform }}
          path: |
            release/pi-station-edge-${{ matrix.platform }}.tar.gz
            release/pi-station-edge-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish edge release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-station-edge-*
          path: release
          merge-multiple: true
      - name: Verify complete artifact set
        shell: bash
        run: |
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            test -f "release/pi-station-edge-${platform}.tar.gz"
            test -f "release/pi-station-edge-${platform}.tar.gz.sha256"
          done
      - name: Move edge tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/edge" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/edge" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Publish edge assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Pi Station edge (${GITHUB_SHA::7})"
          notes="Validated build of master at commit $GITHUB_SHA. Edge builds can contain unstable changes."
          if gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload edge release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit edge --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          else
            gh release create edge release/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$title" --notes "$notes"
          fi
